name: Style Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Setup python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run isort
        run: uv run --no-sync isort --diff --check sphinxcontrib tests
      - name: Run yapf
        run: uv run --no-sync yapf --diff --recursive sphinxcontrib tests
      - name: Run mypy
        run: uv run --no-sync mypy sphinxcontrib
      - name: Run flake8
        run: uv run --no-sync flake8 sphinxcontrib tests
