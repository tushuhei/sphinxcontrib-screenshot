name: Unit Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Setup python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install requirements
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Playwright install
        run: uv run --no-sync playwright install
      - name: Run unittest
        id: pytest
        shell: python
        run: |
          import os
          import subprocess
          import sys

          result = subprocess.run(['uv', 'run', '--no-sync', 'pytest'], capture_output=True, text=True)
          output = result.stdout
          print(output)
          if result.returncode > 0:
            files = [line.strip() for line in output.splitlines() if "obtained" in line and os.path.exists(line.strip())]
            if files:
              print("Faulty files:", files)
              with open(os.getenv("GITHUB_OUTPUT"), "a") as fd:
                fd.write("imgs=" + "\n".join(files))

          sys.exit(result.returncode)
      - name: Upload failed image artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-images-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ steps.pytest.outputs.imgs }}
